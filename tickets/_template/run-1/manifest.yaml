# Ticket run manifest. Written by the orchestrator only; agents never edit it.
# Ticket status is DERIVED from the agent and artifact statuses below. Do not store it here.
ticket: PROJ-000
run: 1
kind: story                    # one of the kinds in config/agents.yaml (set by new_ticket.py --kind)
origin: ""                    # chore and spike: tech-debt | ops | experiment | other
prd_refs: []                  # for example [PRD-12#R4]


# agents: and artifacts: are generated from config/agents.yaml by scripts/new_ticket.py

repos: []                      # this run's repos, copied at the gate with sets_repos_from (e.g. tasks.md)

release:
  deploy_order: independent    # independent | ordered, copied from the Release section of tasks.md
  sequence: []                  # for ordered: repos in deploy order
  repos: {}                     # repo -> merged | deployed | failed (from CI/CD events)

gates: {}   # per gated agent, e.g. reviewer: {human_required: true}, copied from its report (when: risk_flagged)

acceptance:
  policy: tbd
  # Suggested default to try (not decided):
  #   ticket accepted by evidence: deployed and healthy, every AC mapped to a passing test,
  #   no blocking comments; a human (QE or PO) signs off when the change is risk-flagged
  #   or user-visible. Requirement-level acceptance by the PO when all tickets of a PRD
  #   requirement are done (sprint review or PI demo).
  ticket_accepted: null
  signed_off_by: null
  requirement_accepted: null
