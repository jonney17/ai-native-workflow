<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow playbook</title>
<style>
:root {
  color-scheme: dark;
  --bg:#0e1120; --panel:#171b30; --panel2:#1e2340; --line:#2d3558; --text:#e9ecf8; --mute:#8d96bb;
  --blue:#5b9dff; --green:#41d392; --amber:#ffb454; --red:#ff6b7d; --violet:#a78bfa; --grey:#667092; --teal:#3dd6d0;
  --shadow:0 18px 50px #05060d66;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1100px 600px at 85% -15%,#5b9dff18,transparent 65%),radial-gradient(900px 600px at -5% 110%,#a78bfa12,transparent 65%),#0a0c18;color:var(--text);font:15px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:wait}
.shell{max-width:1540px;margin:auto;padding:28px 30px 60px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:26px}
.topbar .tabbar{justify-self:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em}
.brandmark{display:grid;place-items:center;width:38px;height:38px;border:1px solid #5b9dff77;border-radius:12px;background:#5b9dff1a;color:var(--blue)}
.brand small{display:block;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.16em}
.top-actions{display:flex;align-items:center;gap:12px;color:var(--mute)}
.online{display:inline-flex;align-items:center;gap:8px}.online i,.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green)}
.layout{display:grid;grid-template-columns:255px minmax(0,1fr);gap:22px;align-items:start}
.layout.sidebar-collapsed{grid-template-columns:48px minmax(0,1fr);gap:14px}
.panel,.card{background:linear-gradient(145deg,#191d33f2,#14182a);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sidebar{padding:18px;position:sticky;top:20px}
.sidebar-collapsed .sidebar{padding:12px 7px}
.section-label,.eyebrow{font-size:11px;color:var(--mute);font-weight:750;letter-spacing:.15em;text-transform:uppercase}
.section-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ticket-list{display:grid;gap:7px;max-height:48vh;overflow:auto}
.ticket-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:5px}
.ticket-link{display:block;width:100%;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);padding:10px 11px}
.ticket-link:hover,.ticket-link.active{background:#242b52;border-color:#35406b}
.ticket-link strong{display:block;font-size:13px}.ticket-link span{font-size:11px;color:var(--mute)}
.ticket-remove{padding:6px 8px;font-size:10px}
.backlog-items{margin:12px 0;border-bottom:1px solid var(--line);padding-bottom:12px}
.backlog-items summary{cursor:pointer;color:var(--mute);font-size:12px;font-weight:700}
.backlog-list{display:grid;gap:8px;margin-top:8px;max-height:34vh;overflow:auto}
.backlog-entry{display:block;width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:#111426aa;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.backlog-entry:hover,.backlog-entry.selected{background:#242b52;border-color:#35406b}
.backlog-entry strong{display:block;font-size:12px}
.backlog-description{display:block;margin-top:4px;color:var(--mute);font-size:10px;line-height:1.45}
.archived-items{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.archived-items summary{cursor:pointer;color:var(--mute);font-size:12px;font-weight:700}
.archived-list{display:grid;gap:6px;margin-top:8px}
.archived-entry{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--mute);font-size:12px}
.panel-toggle{width:100%;border:0;background:transparent;color:var(--text);padding:0;text-align:left;font-size:11px;font-weight:750;letter-spacing:.15em;text-transform:uppercase}
.panel-toggle:hover{color:var(--blue)}
.panel-toggle-meta{display:flex;align-items:center;gap:9px}
.panel-toggle-meta #ticket-panel-toggle-label{color:var(--blue);font-size:10px;letter-spacing:.04em}
.panel-toggle-icon{color:var(--blue);font-size:18px;line-height:1}
.sidebar-collapsed .panel-toggle{padding:4px 0}
.sidebar-collapsed .panel-toggle-meta{flex-direction:column;gap:10px}
.sidebar-collapsed .panel-toggle-title{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.sidebar-collapsed #ticket-panel-toggle-label{display:none}
.sidebar-collapsed .panel-toggle-icon{font-size:22px}
.create{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
.main{min-width:0}
.hero{padding:25px 27px;margin-bottom:17px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#5b9dff12;right:-90px;top:-150px;pointer-events:none}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-.04em;margin:5px 0 7px}
.subtitle{color:var(--mute);max-width:780px}
.hero-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px}
.pill,.status{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;color:var(--mute);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.ready,.status.done,.status.approved,.status.deployed{color:var(--green);border-color:#41d39255;background:#41d39210}
.status.working{color:var(--violet);border-color:#a78bfa55;background:#a78bfa10}
.status.draft{color:var(--violet);border-color:#a78bfa55;background:#a78bfa10}
.status.stale{color:var(--amber);border-color:#ffb45455;background:#ffb45410}
.status.blocked,.status.failed,.status.rejected,.status.escalated,.status.error{color:var(--red);border-color:#ff6b7d55;background:#ff6b7d10}
.status.disabled,.status.waiting,.status.missing,.status.not_required{color:var(--mute)}
.status.planning,.status.building,.status.verifying,.status.in_review,.status.deploying,.status.investigating,.status.awaiting_findings_review,.status.awaiting_acceptance,.status.needs_input{color:var(--blue);border-color:#5b9dff55;background:#5b9dff10}
.grid-head{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 11px}
.grid-head h2{font-size:15px;margin:0}.grid-head .hint{font-size:12px;color:var(--mute)}
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.agent{padding:15px;border-radius:13px;background:#171b30cc;border:1px solid var(--line);min-height:132px;position:relative;overflow:hidden}
.agent:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--agent-color,var(--blue))}
.agent[data-agent-node]{cursor:help}
.agent-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.agent h3{margin:0;font-size:14px}.agent p{font-size:11px;color:var(--mute);margin:10px 0 0;line-height:1.5}
.agent .status{font-size:9px;padding:4px 7px}
.agent-log-popover{position:fixed;z-index:20;width:min(1000px,calc(100vw - 32px));max-height:62vh;padding:14px;border:1px solid #53618f;border-radius:13px;background:#0d1020;box-shadow:0 20px 60px #000b;pointer-events:auto}
.agent-log-head{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--text);font-size:12px;font-weight:750}
.agent-log-path{color:var(--mute);font-size:11px;font-weight:400}
.agent-log-text{max-height:calc(62vh - 52px);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#080a14;border:1px solid var(--line);border-radius:8px;padding:12px;margin:9px 0 0;color:#d4daf4;font:12px/1.5 "Cascadia Code",Consolas,monospace}
.human-steps{margin:0 0 12px;padding-left:20px}.human-steps li{margin-bottom:10px}
.hub-viewport{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#101426aa}
.hub{position:relative;min-width:920px;min-height:460px}
.hub-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hub-center{position:absolute;transform:translate(-50%,-50%);width:270px;padding:12px;border:1px solid #3a4470;border-radius:16px;background:#12162b;box-shadow:0 10px 30px #05060d88;z-index:2}
.hub-center h4{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.art-row{display:flex;align-items:center;gap:8px;padding:8px 11px;margin-bottom:8px;border:1px solid var(--line);border-radius:10px;background:#171b30;font:12px/1.3 "Cascadia Code",Consolas,monospace;transition:background .15s,border-color .15s;box-shadow:0 4px 12px #05060d55}
.art-row:last-child{margin-bottom:0}
.art-row .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#596486}
.art-row.ready,.art-row.approved{border-color:#41d39277}.art-row.draft{border-color:#a78bfa77}.art-row.stale{border-color:#ffb45499}.art-row.rejected{border-color:#ff6b7d99}
.art-row.ready .dot,.art-row.approved .dot{background:var(--green)}.art-row.draft .dot{background:var(--violet)}.art-row.stale .dot{background:var(--amber)}.art-row.rejected .dot{background:var(--red)}
.art-row a{color:inherit;text-decoration:none;border-bottom:1px dotted #a9b5df}.art-row .st{margin-left:auto;font:10px Inter,sans-serif;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.art-row.missing{opacity:.7}
.art-row.needed{background:#1d2a55;border-color:#5b9dff}.art-row.made{background:#17332f;border-color:#41d392}
.hub{user-select:none;-webkit-user-select:none}
.hub .art-row{position:absolute;transform:translate(-50%,-50%);width:230px;margin:0;z-index:2;cursor:grab;touch-action:none}
.hub .agent{cursor:grab;touch-action:none}
.hub .dragging{cursor:grabbing;z-index:5;box-shadow:0 14px 34px #000a}
.hub .dim{opacity:.35}.hub .pinned{outline:2px solid #ffffff55;outline-offset:3px}
.agent{position:absolute;transform:translate(-50%,-50%);width:210px;padding:11px 13px;border:1.5px solid var(--c);border-radius:12px;background:#151a30;z-index:2;box-shadow:0 8px 22px #05060d77}
.agent h3{margin:0 0 6px;font-size:14px;color:var(--c)}
.agent-status{display:flex;align-items:flex-start;gap:8px;padding:4px 0}.agent-status [data-agent-node]{cursor:help}
.run-live{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:700;color:var(--mute);cursor:help;background:#ffffff06}
.run-live .dot{width:8px;height:8px;border-radius:50%;background:#596486}.run-live.on{color:var(--text);border-color:#41d39255}.run-live.on .dot{background:var(--green);animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;box-shadow:0 0 0 0 #41d39266}50%{opacity:.55;box-shadow:0 0 0 5px #41d39200}}
.agent-status .status{flex:none;font-size:9px;padding:4px 7px}
.agent-note{font-size:11px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.agent-io{margin-top:6px;font-size:10.5px;color:var(--mute);line-height:1.5;overflow-wrap:anywhere}.agent-io b{color:#a9b5df;font-weight:700;margin-right:4px}
.agent .changes{margin-top:6px}
.hub-legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:11.5px;margin:-3px 2px 10px}
.hub-legend svg{vertical-align:-2px;margin-right:5px}
.agent-busy{display:inline-flex;align-items:center;gap:7px}
.busy-dots{display:inline-flex;gap:3px;align-items:center}
.busy-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:busy-pulse 1s infinite ease-in-out}
.busy-dots i:nth-child(2){animation-delay:.15s}.busy-dots i:nth-child(3){animation-delay:.3s}
@keyframes busy-pulse{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.artifact-flow-viewport{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#101426aa;padding:18px}
.artifact-flow{position:relative;display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));grid-template-rows:24px repeat(4,minmax(92px,auto));gap:26px 34px;min-width:1000px}
.flow-phase{z-index:1;color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.artifact-links{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.artifact-link{fill:none;stroke:#596486;stroke-width:2;opacity:.72;marker-end:url(#artifact-arrow)}
.artifact-link.ready{stroke:var(--green)}
.artifact-link.stale{stroke:var(--amber)}
.artifact-link.rejected{stroke:var(--red)}
.artifact-node{position:relative;z-index:1;align-self:stretch;padding:11px;border:1px solid var(--line);border-radius:11px;background:#171b30;min-width:0;box-shadow:0 6px 16px #05060d66}
.artifact-node.ready,.artifact-node.approved{border-color:#41d39288}
.artifact-node.draft{border-color:#a78bfa88}
.artifact-node.stale{border-color:#ffb454aa}
.artifact-node.rejected{border-color:#ff6b7d99}
.artifact-node-head{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.artifact-name{font:12px/1.45 "Cascadia Code",Consolas,monospace;overflow-wrap:anywhere}
.artifact-open-link{color:inherit;text-decoration:none;border-bottom:1px dotted #a9b5df;cursor:pointer}
.artifact-open-link:hover{text-decoration:underline;color:#fff}
.artifact-open-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
.reason{font-size:10px;color:var(--amber);margin-top:5px;max-width:290px}
.artifact-node .status{font-size:9px;padding:4px 7px}
.artifact-repos{display:grid;gap:5px;margin-top:9px;padding-top:8px;border-top:1px solid #ffffff12}
.artifact-repo{display:flex;align-items:center;justify-content:space-between;gap:6px;color:var(--mute);font:10px/1.4 "Cascadia Code",Consolas,monospace}
.changes{width:100%;border-top:1px solid #ffffff0d;margin-top:9px;padding-top:8px}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.action-card{padding:15px}.action-card h3{font-size:13px;margin:0 0 5px}.action-card p{color:var(--mute);font-size:11px;margin:0 0 12px}
.btn{text-decoration:none;display:inline-flex;align-items:center;border:1px solid #35406b;border-radius:9px;padding:9px 12px;background:#22294a;color:var(--text);font-size:12px;font-weight:700}
.btn:hover{background:#2b345d;border-color:#5b9dff99}
.btn.primary{background:#5b9dff;color:#08101d;border-color:#5b9dff}.btn.primary:hover{background:#77adff}
.btn.subtle{background:transparent}
.btn.danger{border-color:#ff6b7d66;color:#ff9daa}
.field{width:100%;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:#0e1120;color:var(--text);outline:none}
.field:focus{border-color:var(--blue)}
.field-label{display:block;font-size:11px;color:var(--mute);margin:8px 0 4px}
.form-row{display:flex;gap:7px}.form-row>*{min-width:0;flex:1}
.notice{margin:12px 0;padding:11px 13px;border-radius:10px;background:#5b9dff12;border:1px solid #5b9dff35;color:#c7d8ff;font-size:12px}
.notice.warn{background:#ffb45410;border-color:#ffb45444;color:#ffd9a8}
.notice.error{background:#ff6b7d10;border-color:#ff6b7d55;color:#ffc1c8}
.recommendations{padding:16px 18px;margin:12px 0 16px;border:1px solid #5b9dff4d;border-radius:13px;background:linear-gradient(120deg,#5b9dff12,#171b30aa)}
.recommendations h3{margin:0 0 9px;font-size:14px}
.recommendations ol{margin:0;padding-left:22px;display:grid;gap:8px}
.recommendations li{padding-left:3px;color:#d4d9f2;font-size:12px;overflow-wrap:anywhere}
.recommendations li::marker{color:var(--blue);font-weight:800}
.recommendations .who{color:var(--mute);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-right:7px}
.recommendations .command{display:block;color:#9eacd9;font:11px/1.5 "Cascadia Code",Consolas,monospace;margin-top:3px;overflow-wrap:anywhere}
.warning-list{display:grid;gap:5px;color:#ffd9a8;font-size:11px;padding-left:17px}
.empty{padding:32px;text-align:center;color:var(--mute)}
.joblog{max-height:180px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#090b16;border:1px solid var(--line);border-radius:9px;padding:10px;font:11px/1.45 "Cascadia Code",Consolas,monospace;color:#c4cbea;margin:8px 0 0}
.jobs{display:grid;gap:8px;margin-top:16px}
.job{padding:12px;border:1px solid var(--line);border-radius:11px;background:#111426aa}
.job-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.job-actions{display:flex;justify-content:flex-end;margin-top:10px}
.history{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#11142666}
.history summary{cursor:pointer;padding:12px 14px;color:var(--mute);font-size:12px;font-weight:700}
.history[open] summary{border-bottom:1px solid var(--line)}
.history .jobs{padding:0 12px 12px}
.auditor-card{padding:16px 18px;margin-bottom:16px;border-left:3px solid #a78bfa}.auditor-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.auditor-head h2{font-size:15px;margin:0}.auditor-head .grow{flex:1}.audit-list{display:grid;gap:6px;margin-top:10px}.audit-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}.audit-row strong{min-width:90px}.audit-row a{color:#c7d8ff}
.tabbar{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}
.tabbar button{border:0;background:transparent;color:var(--mute);font-weight:700;font-size:13px;padding:8px 16px;border-radius:9px}
.tabbar button[aria-selected="true"]{background:#5b9dff22;color:var(--text);box-shadow:inset 0 0 0 1px #5b9dff66}
.tab-page[hidden],.top-actions[hidden],.runs-view[hidden]{display:none!important}
.runs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:6px}
.run-card{padding:16px 18px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color .15s,transform .15s}
.run-card:hover{border-color:#5b9dff77;transform:translateY(-1px)}
.run-card .key{font:12px "Cascadia Code",Consolas,monospace;color:var(--blue);font-weight:700}
.run-card h3{margin:0;font-size:15px;line-height:1.35}.run-card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.run-card .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.jira-head .btn{padding:8px 16px}.runs-split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start;margin-top:6px}
.run-tabs{display:grid;gap:6px;position:sticky;top:20px}
.run-tab{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid transparent;border-radius:11px;background:#ffffff05;color:var(--text);padding:10px 12px}
.run-tab:hover{background:#242b52}.run-tab[aria-selected="true"]{background:#5b9dff1f;border-color:#5b9dff66;border-left-color:var(--blue)}
.run-tab .status{font-size:10px;padding:3px 8px}.run-tab-wrap{display:grid;gap:4px}.run-archive{justify-self:end;padding:3px 10px;font-size:11px}
.run-tab strong{display:block;font-size:13px}.run-tab span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.jira-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.jira-col{display:grid;gap:12px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:16px;background:#ffffff05}
.jira-col>h3{margin:2px 4px 2px;font-size:13px;letter-spacing:.04em;color:var(--mute);display:flex;justify-content:space-between}
@media(max-width:1100px){.jira-cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){.runs-split,.jira-cols{grid-template-columns:1fr}.run-tabs{position:static}}
.detail-bar{display:flex;align-items:center;gap:10px;margin:0 0 14px}.detail-bar .grow{flex:1}
@media(max-width:850px){.topbar{grid-template-columns:1fr;gap:12px}}
.jira-card .hint{font-size:12px;color:var(--mute)}
.jira-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 2px 14px}
.jira-head h2{margin:0;font-size:18px}.jira-head .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--mute);padding:6px 12px;font-size:12px;font-weight:700}
.seg button.on{background:#5b9dff22;color:var(--text)}
.jira-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

<body>
<div class="shell">

    <div></div>

</div>
<div id="agent-log-popover" class="agent-log-popover" role="tooltip" hidden>
  <div class="agent-log-head"><span id="agent-log-title"></span><span id="agent-log-path" class="agent-log-path"></span></div>
  <pre id="agent-log-text" class="agent-log-text"></pre>
</div>
<script>
const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const stateClass = (value) => String(value || 'missing').toLowerCase().replace(/[^a-z0-9]+/g, '_');
let selected = new URLSearchParams(location.search).get('ticket') || '';
let current = null, knownTickets = [], backlogTickets = [], archivedTickets = [], activeJobs = [], confirmationMessage = '';
let artifactRefreshRequest = 0;
let agentLogRequest = 0, agentLogTimer = 0, agentLogHideTimer = 0, hoveredAgentNode = null;
// Agents (called agents in the config file), their names and colors come from config/agents.yaml (GET /api/config)
let agentNames = {}, agentColors = {}, flowConfig = null;
const PALETTE = ['#5b9dff','#3dd6d0','#41d392','#ffb454','#a78bfa','#ff8fab','#f6d365','#7ee8fa'];
async function loadConfig() {
  flowConfig = await request('/api/config');
  agentNames = {}; agentColors = {};
  Object.entries(flowConfig.summary.agents || {}).forEach(([name, agent], i) => {
    agentNames[name] = agent.title || name;
    agentColors[name] = agent.color || PALETTE[i % PALETTE.length];
  });
}
function gateDef(kind, agent) { return flowConfig?.summary?.kinds?.[kind]?.agent_views?.[agent]?.gate || null; }

async function request(url, options) {
  const response = await fetch(url, options);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}
function pill(value) { return `<span class="status ${stateClass(value)}">${esc(value || 'unknown')}</span>`; }
function button(label, action, extra = '', cls = '') {
  return `<button class="btn ${cls}" data-action="${esc(action)}" ${extra}>${esc(label)}</button>`;
}
function actionCard(title, description, contents) {
  return `<article class="card action-card"><h3>${esc(title)}</h3><p>${esc(description)}</p>${contents}</article>`;
}
function renderTickets() {   // Ticket runs tab: one vertical tab per ticket that has a run
  $('#run-count').textContent = knownTickets.length ? `${knownTickets.length} with a run` : '';
  $('#run-tabs').innerHTML = knownTickets.length ? knownTickets.map(item => {
    const jira = backlogTickets.find(x => x.ticket === item.ticket) || {};
    return `<div class="run-tab-wrap"><button class="run-tab" role="tab" type="button" data-ticket="${esc(item.ticket)}" aria-selected="${item.ticket === selected}">
      <strong>${esc(item.ticket)}</strong><span>${esc(jira.title || item.kind || '')}</span><div style="margin-top:7px">${pill(item.status || 'unknown')}</div></button></div>`;

}
let jiraFilter = 'mine', jiraUser = '';
function renderBacklog() {   // the Jira board tab: cards grouped into Not started / Running / Archived (fake backlog for now)
  const mine = backlogTickets.filter(item => item.mine);
  const items = jiraFilter === 'mine' ? mine : backlogTickets;
  $('#jira-title').textContent = jiraFilter === 'mine' ? 'My tickets' : 'All tickets';
  $('#jira-user').textContent = jiraUser ? `· ${jiraUser}` : '';
  $('#jira-filter').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.filter === jiraFilter));
  const card = item => {
    const started = item.has_run;
    const finished = item.state === 'Done' && started;
    const label = started ? 'Open workflow' : 'Start working';
    return `<article class="card jira-card">
      <div class="meta"><span class="key">${esc(item.ticket)}</span>${pill(item.archived ? 'Archived' : item.running ? 'Running' : item.state)}</div>
      <h3>${esc(item.title)}</h3>
      <p>${esc(item.description)}</p>
      <div class="meta">${item.repos.map(r => `<span class="pill">${esc(r)}</span>`).join('')}<span class="hint">${esc(item.kind)} · ${esc(item.assignee || 'unassigned')}</span></div>
      <div class="foot"><span class="hint">${esc(started && !item.archived ? item.detail : '')}</span>
        ${item.archived ? `<button class="btn subtle" data-restore-ticket="${esc(item.ticket)}" title="Bring this ticket back">Restore</button>`
          : finished ? `<button class="btn" data-remove-ticket="${esc(item.ticket)}" title="Move this finished ticket to the archive">Archive</button>`
          : `<button class="btn ${started ? '' : 'primary'}" data-jira="${esc(item.ticket)}">${label}</button>`}</div>
    </article>`;
  };
  const done = i => i.state === 'Done';
  const cols = [['Not started', i => !i.archived && !i.has_run], ['Running', i => !i.archived && i.has_run && !done(i)], ['Done', i => !i.archived && i.has_run && done(i)], ['Archived', i => i.archived]];
  $('#jira-cards').className = 'jira-cols';
  $('#jira-cards').innerHTML = items.length ? cols.map(([name, test]) => {
    const list = items.filter(test);
    return `<section class="jira-col"><h3><span>${name}</span><span>${list.length}</span></h3>${list.map(card).join('') || '<div class="hint" style="padding:4px 6px">Nothing here</div>'}</section>`;
  }).join('') : `<div class="card empty" style="grid-column:1/-1">${jiraFilter === 'mine'
      ? `No tickets are assigned to ${esc(jiraUser || 'you')}. <a href="#" data-filter-all="1">Show all tickets</a>.`
      : 'No tickets on the board (config/backlog.yaml).'}</div>`;
}
async function openRuns() {   // entering the Ticket runs tab: show the selected run, or the first one
  await refreshTickets().catch(error => console.error(error));
  renderTickets();
  if (selected) refreshStatus().catch(error => console.error(error));
  refreshAuditor();
}
const runsVisible = () => !$('#tab-workflow').hidden;
function updateWorkflowStartButton() {
  const start = $('#start-workflow');
  const contextStatus = current?.artifacts?.['ticket-context.md']?.status;
  const contextReady = ['ready','approved'].includes(contextStatus);
  const ticket = current?.ticket || selected;
  const backlogItem = backlogTickets.find(item => item.ticket === ticket);
  const isRunning = activeJobs.some(job =>
    job.ticket === ticket && (job.action === 'start' || job.restarts_workflow)
    && ['running','cancelling'].includes(job.status)
  ) || Boolean(backlogItem?.running);
  const complete = current?.status === 'Done' || backlogItem?.state === 'Done';
  const archived = Boolean(backlogItem?.archived);
  const started = Boolean(backlogItem?.has_run || current);
  document.querySelector('.run-live')?.classList.toggle('on', isRunning);
  start.disabled = !ticket || (!current && !backlogItem) || (!contextReady && !backlogItem) || isRunning || complete || archived;
  const statusText = current?.status || backlogItem?.state || '';
  start.dataset.mode = 'start';
  start.classList.add('primary'); start.classList.remove('danger');
  start.textContent = archived ? 'Archived — restore first'
    : isRunning ? (statusText || 'Running')
    : complete ? (statusText || 'Done')
    : started ? 'Start / resume workflow' : 'Start workflow';
  const stopBtn = $('#stop-workflow'); if (stopBtn) stopBtn.disabled = !isRunning || archived;
  start.title = !ticket
    ? 'Select a work item to start its workflow'
    : archived
    ? 'Restore this work item before starting its workflow'
    : !contextReady && !backlogItem
      ? 'Fill ticket-context.md and mark it ready before starting the workflow'
      : isRunning
        ? 'The workflow is running; use Stop to halt it'
        : complete
          ? 'This workflow is already complete'
          : 'Start or resume all workflow workers for the selected work item';
}
function renderOverview(data) {
  const status = data.status;
  $('#overview').innerHTML = `<section class="card hero">
    <div class="hero-head"><div><div class="eyebrow">Run ${esc(status.run)} · ${esc(status.kind)} · ${esc(status.path)}</div>
      <h1>${esc(status.ticket)}</h1><div class="subtitle">${esc(status.detail)}</div></div>${pill(status.status)}</div>
    <div class="hero-meta"><span class="pill">Derived status</span><span class="pill">${esc(status.run)} / current run</span><span class="pill">${Object.keys(status.artifacts || {}).length} artifacts tracked</span></div>
  </section>`;
}
let HUB = null, hubSig = '';
const TRI = (fill, stroke) => `<polygon points="-5,-4 5,0 -5,4" fill="${fill}" stroke="${stroke}" stroke-width="1.2" stroke-linejoin="round"/>`;
function renderAgents(data) {
  const swatch = (c, hollow) => `<svg width="30" height="10" viewBox="0 0 30 10" aria-hidden="true"><line x1="2" y1="5" x2="22" y2="5" stroke="${c}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 6"${hollow ? ' opacity=".7"' : ''}/><polygon points="20,1.5 28,5 20,8.5" fill="${c}"/></svg>`;
  $('#board').innerHTML = `<section id="artifact-readiness"><div class="grid-head"><div style="display:flex;align-items:center;gap:10px"><h2>Agents &amp; artifacts</h2><span class="run-live" data-run-log tabindex="0" title="Hover to read the live log"><i class="dot"></i>Live log</span></div><span class="hint">Drag anything to arrange it · hover or click a node to see its connections · <button class="btn subtle" id="hub-reset" type="button" style="padding:3px 10px;font-size:11px">Reset layout</button></span></div>
    <div class="hub-legend"><span>${swatch('#41d392')}output: agent → artifact it creates</span><span>${swatch('#5b9dff')}input: artifact → agent that reads it</span><span>${swatch('#ffb454')}amber, pulsing: waiting for that artifact</span><span>moving dots: working · still: ready / done</span></div>
    <div class="hub-viewport"><div class="hub" id="hub"></div></div></section>
    ${data.warnings?.length ? `<div class="grid-head"><h2>Attention</h2></div><div class="notice warn"><ul class="warning-list">${data.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}`;
  hubSig = '';
  renderHub(data);
}
let hubPos = {}, hubFocus = {hover: null, pinned: null}, hubDrag = null;
const hubPosKey = kind => `wf-hub-pos-v1:${kind || ''}`;
function hubSavePos() { try { localStorage.setItem(hubPosKey(HUB?.kind), JSON.stringify(hubPos)); } catch {} }
function renderHub(data) {
  const hub = $('#hub');
  if (!hub) return;
  const agents = data.agents || {}, artifacts = data.artifacts || {};
  const sig = JSON.stringify([data.ticket, data.run, agents, Object.entries(artifacts).map(([n, a]) => [n, a.status, a.reason])]);
  if (sig === hubSig) return;     // nothing changed: keep the animations running smoothly
  hubSig = sig;
  const k = flowConfig?.summary?.kinds?.[data.kind] || {};
  const owners = k.artifacts || {}, views = k.agent_views || {};
  const names = Object.keys(artifacts);
  try { hubPos = JSON.parse(localStorage.getItem(hubPosKey(data.kind)) || '{}'); } catch { hubPos = {}; }
  HUB = {kind: data.kind, artifacts, req: Object.fromEntries(Object.keys(agents).map(key => [key, Object.fromEntries((views[key]?.requires || []).map(([a, st]) => [a, st]))])),
    agents: Object.keys(agents).map(key => ({
      key, agent: agents[key],
      needs: (views[key]?.requires || []).map(([a]) => a).filter(a => names.includes(a)),
      makes: names.filter(n => owners[n]?.owner === key || artifacts[n]?.owner === key)
    }))};
  const row = name => {
    const art = artifacts[name] || {status:'missing'};
    const label = art.per_repo ? `${name}/<repo>/` : name;
    const text = !art.per_repo && current?.ticket ? `<a href="${esc(artifactUrl(name))}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>` : esc(label);
    return `<div class="art-row ${stateClass(art.status)}" data-node="a:${esc(name)}" data-art="${esc(name)}" title="${esc(art.reason || art.status)}"><i class="dot"></i><span>${text}</span><span class="st">${esc(art.status)}</span></div>`;
  };
  const agentHtml = HUB.agents.map(({key, agent, needs, makes}, i) => {
    const repos = Object.entries(agent.repos || {}).map(([repo, item]) => `<div class="changes"><div class="agent-top"><span>${esc(repo)}</span>${pill(item.state)}</div></div>`).join('');
    const fmt = list => list.map(n => esc(artifacts[n]?.per_repo ? `${n}/` : n)).join(', ') || '—';
    return `<article class="agent" data-node="g:${esc(key)}" data-agent="${esc(key)}" style="--c:${agentColors[key] || PALETTE[i % PALETTE.length]}">
      <h3>${esc(agentNames[key] || key)}</h3>
      <div class="agent-status">${pill(agent.state).replace('<span class="status', `<span data-agent-node="${esc(key)}" class="status`)}<span class="agent-note">${esc(agent.note || (agent.unmet || []).join(' · ') || '')}</span></div>
      <div class="agent-io"><div><b>needs</b>${fmt(needs)}</div><div><b>makes</b>${fmt(makes)}</div></div>${repos}</article>`;
  }).join('');
  hub.innerHTML = `<svg class="hub-links" aria-hidden="true"></svg>${names.map(row).join('')}${agentHtml}`;

}
function hubNodes() { return [...document.querySelectorAll('#hub [data-node]')]; }
function layoutHub() {      // default positions; anything the person dragged keeps its saved place
  const hub = $('#hub');
  if (!hub || !HUB) return;
  const W = Math.max(920, hub.parentElement.clientWidth);
  hub.style.width = W + 'px';
  const arts = [...hub.querySelectorAll('.art-row')], agents = [...hub.querySelectorAll('.agent')];
  const rowH = Math.max(40, ...arts.map(n => n.offsetHeight)) + 9, rowW = 230, GAP = 16, M = 30;
  const aw = agents[0]?.offsetWidth || 210;
  const sides = {L: [], R: []};
  agents.forEach((n, i) => sides[i % 2 === 0 ? 'L' : 'R'].push(i));
  const total = list => list.reduce((sum, i) => sum + agents[i].offsetHeight, 0) + GAP * Math.max(0, list.length - 1);
  const H = Math.max(500, arts.length * rowH + 2 * M, total(sides.L) + 2 * M, total(sides.R) + 2 * M);
  hub.style.height = H + 'px';
  const cx = W / 2, cy = H / 2, def = {};
  arts.forEach((n, i) => { def[n.dataset.node] = {x: cx, y: cy - arts.length * rowH / 2 + (i + .5) * rowH}; });
  const gapX = Math.max(110, Math.min(200, (W - rowW) / 2 - aw - 24));
  for (const side of ['L', 'R']) {
    const order = sides[side].map(i => {
      const e = HUB.agents[i], ys = [...e.needs, ...e.makes].map(a => def['a:' + a]?.y).filter(y => y != null);
      return {i, want: ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : cy};
    }).sort((p, q) => p.want - q.want);
    let prevBottom = M - GAP;
    order.forEach(o => { const h = agents[o.i].offsetHeight; o.y = Math.max(o.want, prevBottom + GAP + h / 2); prevBottom = o.y + h / 2; });
    const over = prevBottom - (H - M);
    if (over > 0) order.forEach(o => { o.y -= over; });
    order.forEach(o => { def['g:' + HUB.agents[o.i].key] = {x: side === 'L' ? cx - rowW / 2 - gapX - aw / 2 : cx + rowW / 2 + gapX + aw / 2, y: o.y}; });
  }
  hubNodes().forEach(n => {
    const id = n.dataset.node, saved = hubPos[id];
    let x = saved ? cx + saved.dx : def[id].x, y = saved ? cy + saved.dy : def[id].y;
    x = Math.max(n.offsetWidth / 2 + 4, Math.min(W - n.offsetWidth / 2 - 4, x));
    y = Math.max(n.offsetHeight / 2 + 4, Math.min(H - n.offsetHeight / 2 - 4, y));
    n.style.left = x + 'px'; n.style.top = y + 'px';
  });
  drawHubLinks();
}
function drawHubLinks() {
  const hub = $('#hub');
  if (!hub || !HUB) return;
  const focus = hubDrag?.id || hubFocus.hover || hubFocus.pinned;
  const el = id => hub.querySelector(`[data-node="${CSS.escape(id)}"]`);
  const box = n => ({x: parseFloat(n.style.left), y: parseFloat(n.style.top), hw: n.offsetWidth / 2, hh: n.offsetHeight / 2});
  const edge = (b, dx, dy, gap) => { const t = Math.min((b.hw + gap) / (Math.abs(dx) || 1e-6), (b.hh + gap) / (Math.abs(dy) || 1e-6)); return [b.x + dx * t, b.y + dy * t]; };
  const AOK = (art, need) => art && (art.status === need || (need === 'ready' && ['ready','approved'].includes(art.status)) || (!need && ['ready','approved'].includes(art.status)));
  const involved = new Set(focus ? [focus] : []);
  let svg = '';
  HUB.agents.forEach(entry => {
    const gId = 'g:' + entry.key, gEl = el(gId);
    if (!gEl) return;
    const st = entry.agent.state, working = st === 'working', color = getComputedStyle(gEl).getPropertyValue('--c').trim() || '#5b9dff';
    [...entry.needs.map(a => ({a, kind: 'need'})), ...entry.makes.map(a => ({a, kind: 'make'}))].forEach(({a: name, kind}) => {
      const aId = 'a:' + name, aEl = el(aId);
      if (!aEl || !(working || focus === gId || focus === aId)) return;      // only busy agents and the focused node draw connectors
      involved.add(gId); involved.add(aId);
      const G = box(gEl), A = box(aEl);
      let dx = A.x - G.x, dy = A.y - G.y; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
      const P = edge(G, dx, dy, 7), Q = edge(A, -dx, -dy, 7);
      const art = HUB.artifacts[name] || {status: 'missing'}, need = (HUB.req[entry.key] || {})[name];
      let mode, col = kind === 'make' ? '#41d392' : '#5b9dff';      // output green, input blue
      if (kind === 'make') mode = working ? 'flow' : (AOK(art) || art.status === 'draft') ? 'still' : 'idle';
      else if (working) mode = 'flow';
      else if (AOK(art, need)) mode = st === 'done' ? 'faint' : 'still';
      else { mode = st === 'disabled' ? 'idle' : 'wait'; col = ['blocked','failed'].includes(st) ? '#ff6b7d' : '#ffb454'; }
      svg += kind === 'make' ? hubAgent(P, Q, col, mode) : hubAgent(Q, P, col, mode);
    });
  });
  hub.querySelector('.hub-links').innerHTML = svg;
  hubNodes().forEach(n => {
    n.classList.toggle('dim', Boolean(focus) && !involved.has(n.dataset.node));
    n.classList.toggle('pinned', hubFocus.pinned === n.dataset.node);
  });
}
function hubAgent(from, to, color, mode) {     // a dotted line; the dots march in the direction of the flow
  const x1 = from[0].toFixed(1), y1 = from[1].toFixed(1), x2 = to[0].toFixed(1), y2 = to[1].toFixed(1);
  const ang = Math.atan2(to[1] - from[1], to[0] - from[0]) * 180 / Math.PI;
  const opacity = mode === 'faint' ? .3 : mode === 'idle' ? .22 : 1;
  const march = mode === 'flow' ? '<animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.7s" repeatCount="indefinite"/>' : '';
  const pulse = mode === 'wait' ? '<animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>' : '';
  return `<g opacity="${opacity}">${pulse}<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 8">${march}</line>
    <g transform="translate(${x2},${y2}) rotate(${ang.toFixed(1)})"><polygon points="-8,-4.5 0,0 -8,4.5" fill="${color}"/></g></g>`;
}
window.addEventListener('resize', () => requestAnimationFrame(layoutHub));
document.addEventListener('pointerover', event => {      // hover a node: show its connectors
  if (hubDrag) return;
  const id = event.target.closest?.('#hub [data-node]')?.dataset.node || null;
  if (id !== hubFocus.hover) { hubFocus.hover = id; drawHubLinks(); }
});
document.addEventListener('pointerdown', event => {      // drag a node anywhere on the canvas
  const node = event.target.closest?.('#hub [data-node]');

  const item = backlogTickets.find(x => x.ticket === b.dataset.jira);
  selected = b.dataset.jira;
  history.replaceState(null, '', `?ticket=${encodeURIComponent(selected)}#workflow`);
  showTab('workflow');
  if (item && !item.has_run && !item.running) await startBacklogWorkflow(selected, b);
  else refreshStatus();
});
// ---------- tabs
function showTab(name, anchor = '') {
  if (!['jira','workflow','config'].includes(name)) name = 'jira';
  document.querySelectorAll('.tabbar [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  $('#tab-jira').hidden = name !== 'jira';
  $('#tab-workflow').hidden = name !== 'workflow';
  $('#tab-config').hidden = name !== 'config';
  const frame = $('#config-frame');
  if (name === 'config' && (!frame.src || anchor)) frame.src = `/config?embedded=1${anchor ? '#' + anchor : ''}`;
  if (name === 'workflow') { loadConfig().then(openRuns).catch(error => console.error(error)); }
  if (location.hash !== `#${name}`) history.replaceState(null, '', `${location.search}#${name}`);
}
$('.tabbar').addEventListener('click', event => { const b = event.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
window.addEventListener('message', event => {   // the Configuration tab saved: the agents may have changed
  if (event.origin === location.origin && event.data?.type === 'config-saved') loadConfig().then(() => { if (runsVisible()) refreshStatus(); }).catch(() => {});
});
$('#board').addEventListener('click', event => {
  const action = event.target.closest('[data-action]');
  if (action) performAction(action);
});
$('#start-workflow').addEventListener('click', () => {
  const ticket = current?.ticket || selected;
  if (!ticket) return;
  if (backlogTickets.some(item => item.ticket === ticket)) {
    startBacklogWorkflow(ticket, $('#start-workflow'));
  } else {
    performAction($('#start-workflow'));
  }
});
loadConfig().catch(error => console.error(error)).finally(() => refresh());
showTab(location.hash.slice(1) || (new URLSearchParams(location.search).get('ticket') ? 'workflow' : 'jira'));
refreshAuditor();
setInterval(refreshAuditor, 5000);
setInterval(() => { if (runsVisible() && selected) refreshArtifactReadiness(); }, 5000);
setInterval(() => refreshTickets().catch(error => console.error(error)), 30000);
setInterval(() => { if (runsVisible()) refreshTickets().catch(() => {}); }, 5000);
</script>
</body>
</html>
