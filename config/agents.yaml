# One Copilot custom agent per lane. scripts/build_agents.py generates .github/agents/wf-<lane>.agent.md
# from this file plus skills/_common.md and skills/<lane>/instructions.md, so the instructions live in one place.
# UNVERIFIED against Copilot CLI: the file format (frontmatter keys, tool aliases) follows GitHub's custom agent
# format as I know it. If `copilot --agent wf-planner` does not load it, adjust build_agents.py (one function).
version: 1
prefix: wf-

# tools = what the agent is ALLOWED to use. This is where a lane's permissions are enforced, not just asked for.
# Aliases: read, search, edit, execute (shell), web, agent. Add `model:` to pin a model for a lane.
lanes:
  planner:
    description: Planner lane. Explores the ticket and repos, then writes spec, design and tasks (or findings for a spike). Writes artifacts only.
    tools: [read, search, edit]
  qe:
    description: QE lane. Writes the test plan and the acceptance tests from the approved spec and tasks. Does not change product code.
    tools: [read, search, edit, execute]
  dev:
    description: Dev lane, one instance per repo. Builds the change in its own repo only, on its own branch, and records it as an artifact.
    tools: [read, search, edit, execute]
  reviewer:
    description: Reviewer lane, independent of Dev and QE. Verifies the changes against the tests, then reviews them and decides the risk flag.
    tools: [read, search, edit, execute]
  inspect-adapt:
    description: Inspect and Adapt lane. Reads the finished run's trail and telemetry, writes the inspection report, a ledger entry and an overlay candidate.
    tools: [read, search, edit]
