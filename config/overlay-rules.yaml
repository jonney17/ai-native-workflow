# Limits for what Adapt (inspect-adapt lane) may do on its own. HUMANS EDIT THIS FILE ONLY.
version: 1
mode: overlay                  # candidates are applied as a removable layer, never edited into skills/

editable_content:              # advisory content only
  - checklists
  - templates
  - hints
  - examples
forbidden_paths:               # Adapt can never write here
  - config/**
  - skills/**                  # shared rules and templates; only retro promotion changes them
  - .github/agents/**          # the lane agents (baseline instructions); only retro promotion changes them
  - tickets/**/manifest.yaml

limits:
  max_active_per_lane: 3
  one_change_per_candidate: true
  one_lane_per_candidate: true
  expires_after_sprints: 1     # unless the retro explicitly keeps it

evidence:
  required: true               # cite ticket artifacts and telemetry; no evidence, no candidate

auto_revert:
  evaluate_after_tickets: 3
  revert_if_any_worse: [rework_loops, spec_gaps, review_rejections]
  revert_if_cost_up_without_quality_gain: true
  decided_by: script           # never by the agent that proposed the candidate
  compare: within_same_kind    # a spike is never a baseline for a story, and a chore is not compared with a story

before_proposing:
  - read the whole ledger; skip anything already rejected
  - if an active candidate already covers the observation, add evidence to it instead of a new entry
