# How lane workers (scripts/wf_run.py) start an agent session. Skeleton values: tune after the first real runs.
# UNVERIFIED: the copilot flags below come from `copilot -h` (v1.0.x) and have not been run through the workers yet.
version: 1

poll_seconds: 5            # how often a worker looks at the derived state
idle_exit_minutes: 120     # a worker that has not started anything for this long exits

agent:
  # The command wf_launch.py runs after `--`. Placeholders: {prompt} {lane} {repo} {ticket} {run} {attempt}
  # {root} (project folder) {run_dir} (tickets/<ticket>/run-<n>, absolute). Override per shell with the
  # environment variable WF_AGENT_CMD (a JSON list), for example to use the demo's scripted stub agent.
  command:
    - copilot
    - -p
    - "{prompt}"
    - --allow-all-tools            # required for non-interactive mode
    - --no-ask-user                # the lane must not wait for an answer; it proposes question_raised instead
    - --trust-folder               # trust this folder's skills and instructions for this one session
    - --add-dir
    - "{root}"
    - --deny-tool
    - "shell(git push)"
    - -n
    - "{ticket}-{lane}{repo}-a{attempt}"
  # Extra arguments per lane (appended). Example: a spike's Planner may read and write files but not run shell:
  #   planner: [--deny-tool, shell]
  # A per-lane credit cap is available too: [--max-ai-credits, "20"]
  by_lane: {}

prompt: |
  You are the {lane} lane{repo_phrase} of workflow run {ticket}/run-{run}, attempt {attempt}.
  Read {root}/skills/_common.md and {root}/skills/{lane}/instructions.md first and follow them exactly.
  Work item folder: {run_dir}. Read what you need from {run_dir}/artifacts and write only the artifacts of your lane.
  Do not edit manifest.yaml. Append any proposed event to {run_dir}/events.log as the instructions say.
  You cannot ask questions. If you are blocked, append question_raised and stop.
  Stop when your lane's artifacts are written.

deploy:
  # CI/CD stand-in, run once per repo in the Release order after the review passes.
  # Placeholders: {repo} {ticket} {run} {root}. null = a person records it: wf_run.py deployed --repo <name>
  command: null
