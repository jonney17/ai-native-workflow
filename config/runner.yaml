# How lane workers (scripts/wf_run.py) start an agent session. Tune after the first real runs.
version: 1

poll_seconds: 5            # how often a worker looks at the derived state
idle_exit_minutes: 120     # a worker that has not started anything for this long exits

agent:
  # The command wf_launch.py runs. Placeholders: {prompt} {lane} {repo} {ticket} {run} {attempt} {root} {run_dir}.
  # Override per shell with the environment variable WF_AGENT_CMD (a JSON list), e.g. the demo's stub agent.
  command:
    - copilot
    - --agent
    - "wf-{lane}"                  # the lane's role: .github/agents/wf-<lane>.agent.md (edit that file)
    - -p
    - "{prompt}"                   # only the task: which work item
    - --allow-all-tools            # required for non-interactive mode
    - --excluded-tools
    - skill                        # lanes follow their agent file only, not personal Copilot skills
    - --no-ask-user                # a lane never waits for an answer; it raises question_raised instead
    - --trust-folder
    - --add-dir
    - "{root}"
    - --deny-tool
    - "shell(git push)"
    - -n
    - "{ticket}-{lane}{repo}-a{attempt}"
  by_lane: {}              # extra arguments for one lane, e.g. dev: [--model, x] (the Free plan cannot pin a model)
  # Added for a lane instance that works on a repo, when its local path is known (config/repos.local.yaml).
  repo_args:
    - --add-dir
    - "{repo_path}"

prompt: |
  Do your lane's work for this work item.
  root: {root}
  run_dir: {run_dir}
  ticket: {ticket}, run: {run}, attempt: {attempt}{repo_line}{extra_line}
  Follow your agent instructions. They say what to read and what to write.

deploy:
  # CI/CD stand-in, run once per repo in the Release order after the review passes.
  # Placeholders: {repo} {ticket} {run} {root}. null = a placeholder that only prints. The team plugs in the real command.
  command: null
