# How agent workers (scripts/wf_run.py) start an agent session. Tune after the first real runs.
# A person can answer an agent's question: the UI/`wf_run.py answer` reach the open session (mode acp).
version: 1

poll_seconds: 5            # how often a worker looks at the derived state
idle_exit_minutes: 120     # a worker that has not started anything for this long exits

# acp: one long-lived session per agent (copilot --acp). An agent can stop to ask a question and the answer goes into the
#      same session, so it continues with what it already read. print: one-shot `copilot -p` sessions (agent below).
mode: acp          # (--trust-folder is rejected together with --acp)

acp:
  idle_seconds: 300          # no output at all for this long = the session is hung: stop it and retry the agent (0 = never)
  command:
    - copilot
    - --acp
    - --stdio
    - --agent
    - "{instructions}"   # the agent's instructions: `instructions` in config/agents.yaml, default wf-<name>
    - --allow-all-tools
    - --excluded-tools
    - skill
    - shell             # placeholder agents need no shell; remove this line when an agent's real task does
    - --add-dir
    - "{root}"
    - --deny-tool
    - "shell(git push)"
  repo_args:               # added for an agent instance that works on a repo whose local path is known
    - --add-dir
    - "{repo_path}"

agent:
  # The command wf_launch.py runs. Placeholders: {prompt} {agent} {instructions} {repo} {ticket} {run} {attempt} {root} {run_dir}.
  # Override per shell with the environment variable WF_AGENT_CMD (a JSON list), e.g. the demo's stub agent.
  command:
    - copilot
    - --agent
    - "{instructions}"             # the agent's instructions (config/agents.yaml `instructions`, default wf-<name>): .github/agents/<instructions>.agent.md
    - -p
    - "{prompt}"                   # only the task: which work item
    - --allow-all-tools            # required for non-interactive mode
    - --excluded-tools
    - skill                        # agents follow their agent file only, not personal Copilot skills
    - --no-ask-user                # an agent never waits for an answer; it raises question_raised instead
    - --trust-folder
    - --add-dir
    - "{root}"
    - --deny-tool
    - "shell(git push)"
    - -n
    - "{ticket}-{agent}{repo}-a{attempt}"
  by_agent: {}              # extra arguments for one agent, e.g. dev: [--model, x] (the Free plan cannot pin a model)
  # Added for an agent instance that works on a repo, when its local path is known (config/repos.local.yaml).
  repo_args:
    - --add-dir
    - "{repo_path}"

# The first message of each session (which run, which agent file) is fixed in scripts/wf_run.py (task_message):
# an agent's behaviour belongs in its agent file, .github/agents/<agent>.agent.md.

deploy:
  # CI/CD stand-in, run once per repo in the Release order after the review passes.
  # Placeholders: {repo} {ticket} {run} {root}. null = a placeholder that only prints. The team plugs in the real command.
  command: null
